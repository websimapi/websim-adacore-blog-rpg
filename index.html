<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AdaCore Blog RPG</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Kaboom.js canvas will be created here -->
    <div id="ui-container">
        <div id="textbox-container" class="hidden">
            <div id="textbox">
                <p id="dialog-text"></p>
            </div>
            <div id="controls">
                <button id="close-button">Next [space]</button>
            </div>
        </div>
    </div>
    <div id="intro-screen">
        <h1>Ada: A Project-Based Exploration</h1>
        <p>An interactive RPG based on the <a href="https://blog.adacore.com/introduction-to-ada-a-project-based-exploration-with-rosettas" target="_blank" rel="noopener noreferrer">AdaCore Blog Post</a> by Romain Gora.</p>
        <button id="start-button">Start Quest</button>
        <p class="controls-info">Use WASD or Arrow Keys to move.<br>Press SPACE to interact.</p>
    </div>
    <script type="importmap">
    {
        "imports": {
            "kaboom": "https://unpkg.com/kaboom@3000.1.17/dist/kaboom.mjs"
        }
    }
    </script>
    <script type="module" src="main.js"></script>

</body>
</html>
